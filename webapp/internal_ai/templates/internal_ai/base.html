<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>社内AIシステム</title><style>body{font-family:system-ui,"Noto Sans JP",sans-serif;background:#f4f7fb;color:#172033;margin:0}header{background:#123b63;color:white;padding:16px 5%;display:flex;justify-content:space-between}main{max-width:1000px;margin:32px auto;padding:0 20px}.card{background:white;border:1px solid #dbe3ee;border-radius:12px;padding:24px;margin-bottom:20px}input,textarea,select{width:100%;padding:10px;margin:6px 0 16px;box-sizing:border-box;border:1px solid #b9c7d8;border-radius:6px}textarea{min-height:180px}button{background:#1769aa;color:white;border:0;border-radius:6px;padding:11px 20px;cursor:pointer}a{color:inherit}.error{color:#b42318}.answer{white-space:pre-wrap;background:#f8fafc;padding:16px;min-height:100px}.stats{display:flex;gap:16px}.stat{background:#eef6ff;padding:16px;flex:1}.stat strong{display:block;font-size:24px;margin-top:6px}@media(max-width:650px){.stats{display:block}.stat{margin:8px 0}}</style></head><body><header><strong>社内AIシステム</strong>{% if user.is_authenticated %}<span>{{ user.get_full_name|default:user.username }}　<a href="{% url 'internal_ai:logout' %}">ログアウト</a></span>{% endif %}</header><main>{% block content %}{% endblock %}</main></body></html>
