<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>{{ side_name }} ログイン</title>
  <style>
    body {
      margin: 0;
      background: #f5f7fb;
      color: #1d2433;
      font-family: Arial, "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      line-height: 1.6;
    }
    .login-shell {
      display: grid;
      min-height: 100vh;
      place-items: center;
      padding: 24px;
    }
    .login-panel {
      width: min(420px, 100%);
      border: 1px solid #d6dbe6;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 10px 26px rgba(29, 36, 51, 0.08);
      padding: 28px;
    }
    h1 {
      margin: 0 0 20px;
      font-size: 24px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      color: #657084;
      font-size: 13px;
      font-weight: 700;
    }
    input {
      box-sizing: border-box;
      width: 100%;
      min-height: 42px;
      border: 1px solid #a8b1c2;
      border-radius: 6px;
      padding: 8px 10px;
      font: inherit;
    }
    .field {
      margin-bottom: 14px;
    }
    button {
      width: 100%;
      min-height: 42px;
      border: 1px solid #1f5eff;
      border-radius: 6px;
      background: #1f5eff;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }
    .error {
      margin-bottom: 14px;
      padding: 10px;
      border: 1px solid #f0b8b2;
      border-radius: 6px;
      background: #fff7f6;
      color: #b42318;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="login-shell">
    <section class="login-panel">
      <h1>{{ side_name }} ログイン</h1>
      {% if form.errors %}
        <div class="error">ID またはパスワードを確認してください。</div>
      {% endif %}
      <form method="post">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">
        <div class="field">
          <label for="{{ form.username.id_for_label }}">ID</label>
          {{ form.username }}
        </div>
        <div class="field">
          <label for="{{ form.password.id_for_label }}">パスワード</label>
          {{ form.password }}
        </div>
        <button type="submit">ログイン</button>
      </form>
    </section>
  </main>
</body>
</html>
