{% extends 'internal_ai/base.html' %}{% block content %}<div class="card"><h2>AIチャット</h2><form id="chatForm" method="post" action="{% url 'internal_ai:chat_api' %}">{% csrf_token %}<label>質問</label><textarea id="message" name="message" maxlength="{{ profile.max_input_chars }}" required></textarea><label>モデル</label><select name="model">{% for model in models %}<option value="{{ model.model_code }}">{{ model.display_name }}</option>{% endfor %}</select><button id="send">AIへ送信</button></form><p id="error" class="error"></p><h3>AI回答</h3><div id="answer" class="answer">まだ回答はありません。</div><div class="stats"><div class="stat">月額上限<strong>{{ profile.monthly_cost_limit_jpy }}円</strong></div><div class="stat">利用状況<strong><a href="{% url 'internal_ai:usage' %}">確認する</a></strong></div></div></div><script>const f=document.getElementById('chatForm');f.addEventListener('submit',async e=>{e.preventDefault();const b=document.getElementById('send');b.disabled=true;b.textContent='回答作成中…';document.getElementById('answer').textContent='AIが回答を作成しています…';document.getElementById('error').textContent='';try{const r=await fetch(f.action,{method:'POST',body:new FormData(f)}),d=await r.json();if(!r.ok)throw Error(d.error);document.getElementById('answer').textContent=d.answer}catch(x){document.getElementById('error').textContent=x.message;document.getElementById('answer').textContent=''}finally{b.disabled=false;b.textContent='AIへ送信'}});</script>{% endblock %}
