name_patterns:
  - '患者[一-龥]{2,3}(?:[ 　][一-龥]{1,4})?(?:氏|さん)?'
  - '[一-龥]{1,4}[ 　][一-龥]{1,4}(?:氏|さん)'
  - '[一-龥]{2,4}氏'
  - '[一-龥]{2,4}さん'
address_patterns:
  - '(?:住所[:：]?\s*)?(?:北海道|[一-龥]{1,3}[都道府県])[一-龥ァ-ヶー0-9\-]+?(?:市|区|町|村)[一-龥ァ-ヶー0-9\-]*?(?=に住む|に居住|に在住|、|。|$)'
  - '(?:住所[:：]?\s*)?[一-龥ァ-ヶー0-9\-]+?(?:市|区|町|村)[一-龥ァ-ヶー0-9\-]*?(?=に住む|に居住|に在住|、|。|$)'
date_patterns:
  - '(?P<year>(?:平成|昭和|令和)\d{1,4}|令和元|\d{4})年(?P<month>\d{1,2})月(?P<day>\d{1,2})日'
  - '(?P<year>\d{4})[/-](?P<month>\d{1,2})[/-](?P<day>\d{1,2})'
  - '(?<!\d)(?P<month>\d{1,2})月(?P<day>\d{1,2})日'
time_patterns:
  - '(?P<period>午前|午後)?(?P<hour>\d{1,2})[:：](?P<minute>\d{1,2})(?:分)?(?:頃)?'
  - '(?P<period>午前|午後)?(?P<hour>\d{1,2})時(?:(?P<minute>\d{1,2})分)?(?:頃)?'
age_patterns:
  - '(?<!\d)\d{1,3}(?:歳|才)(?!\d)'
phone_patterns:
  - '(?:電話(?:番号)?[:：]?\s*)?(?:\+?81[-\s]?)?0\d{1,4}[-‐‑‒–—―ー－\s]?\d{1,4}[-‐‑‒–—―ー－\s]?\d{4}'
email_patterns:
  - '(?:メール(?:アドレス)?[:：]?\s*)?[A-Za-z0-9._%+-]+[＠@][A-Za-z0-9.-]+\.[A-Za-z]{2,}'
id_patterns:
  - '(?:患者ID|患者番号|カルテ番号|診察券番号|受付番号)[:：]?\s*[A-Za-z0-9\-]{3,}'
room_patterns:
  - '(?<!\d)\d{1,4}号室(?!\d)'
entity_replacements:
  - term: 'リスペリドン'
    category: '抗精神病薬'
  - term: 'オランザピン'
    category: '抗精神病薬'
  - term: 'ジアゼパム'
    category: '抗不安薬'
