name_patterns:
  - '患者[一-龥]{2,3}'
  - '[一-龥]{2,4}氏'
  - '[一-龥]{2,4}さん'
address_patterns:
  - '.*市.*区.*'
  - '.*市.*町.*'
  - '.*区.*町.*'
date_patterns:
  - '\\d{4}年\\d{1,2}月\\d{1,2}日'
  - '\\d{1,2}月\\d{1,2}日'
  - '\\d{1,2}月'
time_patterns:
  - '\\d{1,2}:\\d{2}'
  - '午前\\d{1,2}時'
  - '午後\\d{1,2}時'
entity_replacements:
  - term: 'リスペリドン'
    category: '抗精神病薬'
  - term: 'オランザピン'
    category: '抗精神病薬'
  - term: 'ジアゼパム'
    category: '抗不安薬'
